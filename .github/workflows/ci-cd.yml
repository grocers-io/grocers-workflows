name: CI/CD

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment name (hml ou prd)"
        required: true
        type: string
      ecr-repository:
        description: "Nome do repositório no ECR"
        required: true
        type: string
      gitops-env:
        description: "Pasta do ambiente no gitops (homolog ou production)"
        required: true
        type: string
      build-env:
        description: "Valor do build arg ENVIRONMENT no Docker"
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ needs.release.outputs.new_release_version }} \
            --build-arg ENVIRONMENT=${{ inputs.build-env }} \
            .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ needs.release.outputs.new_release_version }}

  deploy:
    name: Deploy
    needs: [release, build]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Update gitops manifest
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/grocers-io/gitops.git
          cd gitops
          sed -i "s/tag: .*/tag: \"$VERSION\"/" apps/us-east-1/${{ inputs.gitops-env }}/${{ inputs.ecr-repository }}.yaml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/us-east-1/${{ inputs.gitops-env }}/${{ inputs.ecr-repository }}.yaml
          git commit -m "chore: update ${{ inputs.ecr-repository }} to $VERSION [skip ci]"
          git pull --rebase origin main
          git push
