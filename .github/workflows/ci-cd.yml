name: CI/CD

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment name (hml ou prd)"
        required: true
        type: string
      ecr-repository:
        description: "Nome do repositório no ECR"
        required: true
        type: string
      gitops-env:
        description: "Pasta do ambiente no gitops (homolog ou production)"
        required: true
        type: string
      build-env:
        description: "Valor do build arg ENVIRONMENT no Docker"
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true

jobs:
  release:
    uses: grocers-io/grocers-workflows/.github/workflows/release.yml@main

  build:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: grocers-io/grocers-workflows/.github/workflows/build.yml@main
    with:
      environment: ${{ inputs.environment }}
      ecr-repository: ${{ inputs.ecr-repository }}
      build-env: ${{ inputs.build-env }}
      version: ${{ needs.release.outputs.new_release_version }}

  deploy:
    needs: [release, build]
    if: needs.release.outputs.new_release_published == 'true'
    uses: grocers-io/grocers-workflows/.github/workflows/deploy.yml@main
    with:
      environment: ${{ inputs.environment }}
      ecr-repository: ${{ inputs.ecr-repository }}
      gitops-env: ${{ inputs.gitops-env }}
      version: ${{ needs.release.outputs.new_release_version }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
