name: Build and Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment name (hml ou prd)"
        required: true
        type: string
      ecr-repository:
        description: "Nome do repositório no ECR"
        required: true
        type: string
      gitops-env:
        description: "Pasta do ambiente no gitops (homolog ou production)"
        required: true
        type: string
      build-env:
        description: "Valor do build arg ENVIRONMENT no Docker"
        required: true
        type: string
      version:
        description: "Tag gerada pelo release (ex: v1.0.0)"
        required: true
        type: string
      aws-region:
        description: "Região AWS"
        required: true
        type: string
      aws-role-arn:
        description: "ARN da role OIDC para autenticação na AWS"
        required: true
        type: string
      gitops-file:
        description: "Arquivos yaml no gitops (sem .yaml), separados por espaço. Padrão: ecr-repository"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Caminho do Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      build-args:
        description: "Build args extras do Docker, um NOME=valor por linha"
        required: false
        type: string
        default: ""
      deploy:
        description: "Grava a tag no gitops depois do build"
        required: false
        type: boolean
        default: true
    secrets:
      GITOPS_APP_ID:
        required: true
      GITOPS_APP_PRIVATE_KEY:
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ENV: ${{ inputs.build-env }}
          EXTRA_BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          BUILD_ARGS=(--build-arg "ENVIRONMENT=$BUILD_ENV")
          while IFS= read -r line; do
            [ -n "$line" ] && BUILD_ARGS+=(--build-arg "$line")
          done <<< "$EXTRA_BUILD_ARGS"
          docker build -t "$IMAGE:$VERSION" -f "$DOCKERFILE" "${BUILD_ARGS[@]}" .
          docker push "$IMAGE:$VERSION"

  deploy:
    name: Deploy
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Generate gitops token
        id: gitops-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: grocers-io
          repositories: gitops
          permission-contents: write

      - name: Update gitops manifest
        env:
          GITOPS_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          GITOPS_FILES="${{ inputs.gitops-file }}"
          GITOPS_FILES="${GITOPS_FILES:-${{ inputs.ecr-repository }}}"
          git clone --branch main-grocers "https://x-access-token:${GITOPS_TOKEN}@github.com/grocers-io/gitops.git"
          cd gitops
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          for GITOPS_FILE in $GITOPS_FILES; do
            MANIFEST="apps/us-east-1/${{ inputs.gitops-env }}/$GITOPS_FILE.yaml"
            sed -i "s/tag: .*/tag: \"$VERSION\"/" "$MANIFEST"
            git add "$MANIFEST"
          done
          git commit -m "chore: update $GITOPS_FILES to $VERSION [skip ci]"
          git pull --rebase origin main-grocers
          git push
