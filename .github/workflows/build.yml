name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment name (hml ou prd)"
        required: true
        type: string
      ecr-repository:
        description: "Nome do repositório no ECR"
        required: true
        type: string
      build-env:
        description: "Valor do build arg ENVIRONMENT no Docker"
        required: true
        type: string
      version:
        description: "Versão da imagem a ser gerada"
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.version }} \
            --build-arg ENVIRONMENT=${{ inputs.build-env }} \
            .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ inputs.version }}
