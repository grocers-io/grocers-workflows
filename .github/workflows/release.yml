name: Release

on:
  workflow_call:
    outputs:
      new_release_published:
        description: "Se uma nova versão foi publicada"
        value: ${{ jobs.release.outputs.new_release_published }}
      new_release_version:
        description: "Versão gerada pelo semantic-release"
        value: ${{ jobs.release.outputs.new_release_version }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write .releaserc
        run: |
          cat > .releaserc << 'EOF'
          {
            "branches": ["main"],
            "plugins": [
              ["@semantic-release/commit-analyzer", {
                "preset": "angular",
                "releaseRules": [
                  {"type": "refactor", "release": "patch"},
                  {"scope": "no-release", "release": false}
                ]
              }],
              "@semantic-release/release-notes-generator",
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
