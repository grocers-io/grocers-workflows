name: Build and Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment name (hml ou prd)"
        required: true
        type: string
      ecr-repository:
        description: "Nome do repositório no ECR"
        required: true
        type: string
      gitops-env:
        description: "Pasta do ambiente no gitops (homolog ou production)"
        required: true
        type: string
      build-env:
        description: "Valor do build arg ENVIRONMENT no Docker"
        required: true
        type: string
      version:
        description: "Tag gerada pelo release (ex: v1.0.0)"
        required: true
        type: string
      aws-region:
        description: "Região AWS"
        required: true
        type: string
      aws-role-arn:
        description: "ARN da role OIDC para autenticação na AWS"
        required: true
        type: string
      gitops-file:
        description: "Nome do arquivo yaml no gitops (sem .yaml). Padrão: ecr-repository"
        required: false
        type: string
        default: ""
    secrets:
      GH_TOKEN:
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:$VERSION \
            --build-arg ENVIRONMENT=${{ inputs.build-env }} \
            .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:$VERSION

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Update gitops manifest
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          GITOPS_FILE="${{ inputs.gitops-file }}"
          GITOPS_FILE="${GITOPS_FILE:-${{ inputs.ecr-repository }}}"
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/grocers-io/gitops.git
          cd gitops
          sed -i "s/tag: .*/tag: \"$VERSION\"/" apps/us-east-1/${{ inputs.gitops-env }}/$GITOPS_FILE.yaml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/us-east-1/${{ inputs.gitops-env }}/$GITOPS_FILE.yaml
          git commit -m "chore: update $GITOPS_FILE to $VERSION [skip ci]"
          git pull --rebase origin main
          git push
